<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comfy Chair — Assets</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>🪑 Comfy Chair Assets</h1>
  <nav id="tabs">
    <button data-type="output" class="active">Outputs</button>
    <button data-type="input">Inputs</button>
    <button data-type="workflow">Workflows</button>
  </nav>
  <div class="controls">
    <select id="envSelect"><option value="">All environments</option></select>
    <input id="search" type="search" placeholder="Filter by name…">
    <select id="sortSelect">
      <option value="date">Newest first</option>
      <option value="name">Name</option>
      <option value="size">Largest first</option>
    </select>
    <button id="refresh" title="Refresh">⟳</button>
    <button id="emptyTrash" class="danger" title="Permanently delete trashed items for the current tab/environment">🗑 Empty trash</button>
  </div>
</header>

<div id="selectionBar" class="hidden">
  <span id="selCount"></span>
  <select id="dstEnv"></select>
  <button id="copyBtn">Copy to env</button>
  <button id="moveBtn">Move to env</button>
  <button id="deleteBtn" class="danger">Delete (to .trash)</button>
  <button id="clearSel">Clear</button>
</div>

<main>
  <div id="grid"></div>
  <div id="status"></div>
  <button id="loadMore" class="hidden">Load more</button>
</main>

<div id="lightbox" class="hidden">
  <div id="lightboxBody">
    <button id="lbClose">✕</button>
    <div id="lbMedia"></div>
    <aside id="lbInfo"></aside>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
